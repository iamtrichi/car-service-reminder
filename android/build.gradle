// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// The Capacitor plugin modules (AdMob, local-notifications) declare their own
// Kotlin Gradle Plugin version in node_modules. Push our AGP 9-compatible
// version onto every subproject so their build.gradle picks it up.
subprojects {
    ext.kotlin_version = rootProject.ext.kotlin_version
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory.get().asFile
}
